<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEDHAMANTRA • Attendance</title>
<meta name="theme-color" content="#D4A017">
<meta name="description" content="MEDHAMANTRA Employee Attendance System">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.jpeg">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
    --gold: #D4A017;
    --gold-light: #F5D76E;
    --gold-bright: #FFD700;
    --gold-dark: #B8860B;
    --green: #166534;
    --bg: #020617;
    --card: #0f172a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    min-height: 100vh;
    font-family: 'Inter', system-ui, sans-serif;
    background: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(212,160,23,0.18) 0%, transparent 50%),
        radial-gradient(circle at 50% 0%, rgba(212,160,23,0.08) 0%, transparent 40%),
        linear-gradient(160deg, #020617 0%, #0a0f1c 40%, #020617 100%);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 440px;
    background: rgba(15, 23, 42, 0.92);
    backdrop-filter: blur(20px);
    border-radius: 28px;
    overflow: hidden;
    border: 1px solid rgba(212, 160, 23, 0.28);
    box-shadow: 
        0 25px 60px rgba(0,0,0,0.55),
        0 0 0 1px rgba(212,160,23,0.08),
        inset 0 1px 0 rgba(255,255,255,0.04);
}

.header {
    padding: 28px 24px 22px;
    text-align: center;
    background: linear-gradient(180deg, rgba(30,41,59,0.6) 0%, transparent 100%);
    border-bottom: 1px solid rgba(212,160,23,0.18);
    position: relative;
}

.header::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212,160,23,0.4), transparent);
}

.logo {
    width: 82px;
    height: 82px;
    object-fit: contain;
    background: #000;
    border-radius: 20px;
    padding: 6px;
    border: 2px solid var(--gold);
    box-shadow: 
        0 0 0 4px rgba(212,160,23,0.12),
        0 0 40px rgba(212,160,23,0.25),
        0 8px 24px rgba(0,0,0,0.4);
}

.brand {
    margin-top: 16px;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 0.5px;
    line-height: 1.1;
}

.brand .medha { color: var(--gold-light); }
.brand .mantra { color: #f8fafc; }

.subtitle {
    margin-top: 6px;
    color: #94a3b8;
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    font-weight: 600;
}

.content {
    padding: 26px 24px 28px;
}

.status {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    margin-bottom: 24px;
    background: rgba(15,23,42,0.8);
    border-radius: 16px;
    border: 1px solid rgba(51,65,85,0.7);
    font-size: 14px;
    font-weight: 500;
}

.status i { font-size: 18px; }

label {
    display: block;
    margin-bottom: 8px;
    color: #94a3b8;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.8px;
}

.field { margin-bottom: 18px; }

.select-wrap { position: relative; }

select {
    width: 100%;
    appearance: none;
    background: rgba(15,23,42,0.9);
    color: white;
    border: 1px solid rgba(51,65,85,0.8);
    border-radius: 14px;
    padding: 15px 48px 15px 16px;
    font-size: 15px;
    font-weight: 500;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
}

select:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(212,160,23,0.15);
}

.select-wrap i {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gold);
    pointer-events: none;
    font-size: 15px;
}

.camera-box {
    display: flex;
    justify-content: center;
    margin: 28px 0 10px;
}

.camera-container {
    position: relative;
    width: 240px;
    height: 240px;
}

video, #preview {
    width: 240px;
    height: 240px;
    object-fit: cover;
    border-radius: 50%;
    border: 4px solid var(--gold);
    background: #020617;
    box-shadow: 
        0 0 0 8px rgba(212,160,23,0.12),
        0 0 40px rgba(212,160,23,0.18),
        0 15px 40px rgba(0,0,0,0.45);
}

.camera-ring {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.18);
    pointer-events: none;
}

.camera-text {
    text-align: center;
    color: #94a3b8;
    font-size: 12px;
    font-weight: 500;
    margin-top: 14px;
    letter-spacing: 0.3px;
}

button {
    width: 100%;
    border: 0;
    cursor: pointer;
    transition: all 0.22s ease;
    font-family: inherit;
}

button:hover { transform: translateY(-2px); }
button:active { transform: translateY(0); }

.capture {
    padding: 16px;
    border-radius: 14px;
    color: #111827;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.4px;
    background: linear-gradient(135deg, #D4A017 0%, #F5D76E 100%);
    box-shadow: 0 8px 24px rgba(212,160,23,0.28);
}

.capture:hover {
    box-shadow: 0 12px 28px rgba(212,160,23,0.38);
}

.submit {
    margin-top: 12px;
    padding: 16px;
    border-radius: 14px;
    color: white;
    font-size: 15px;
    font-weight: 700;
    background: linear-gradient(135deg, #166534 0%, #15803d 100%);
    box-shadow: 0 8px 20px rgba(22,101,52,0.25);
}

.submit:hover {
    box-shadow: 0 12px 26px rgba(22,101,52,0.35);
}

.install {
    display: none;
    margin-top: 12px;
    padding: 14px;
    border-radius: 14px;
    color: #111827;
    font-size: 14px;
    font-weight: 700;
    background: white;
}

.footer {
    padding: 16px 20px;
    text-align: center;
    border-top: 1px solid rgba(51,65,85,0.6);
    color: #64748b;
    font-size: 11px;
    letter-spacing: 0.3px;
}

#result {
    position: fixed;
    inset: 0;
    background: rgba(2,6,23,0.96);
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    backdrop-filter: blur(8px);
}

.result-box {
    width: 100%;
    max-width: 380px;
    text-align: center;
    padding: 40px 28px;
    background: rgba(15,23,42,0.95);
    border-radius: 28px;
    border: 1px solid rgba(212,160,23,0.25);
    box-shadow: 0 25px 60px rgba(0,0,0,0.5);
}

.result-icon { font-size: 72px; margin-bottom: 18px; }

.result-title {
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 12px;
}

.result-details {
    color: #cbd5e1;
    font-size: 15px;
    line-height: 1.7;
}

.done {
    margin-top: 28px;
    padding: 13px 32px;
    width: auto;
    background: white;
    color: #111827;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14px;
}

.hidden { display: none !important; }

@media (max-width: 480px) {
    body { padding: 12px; }
    .content { padding: 22px 18px 24px; }
    .camera-container, video, #preview {
        width: 210px;
        height: 210px;
    }
    .brand { font-size: 24px; }
    .logo { width: 72px; height: 72px; }
}
</style>
</head>
<body>
<div class="card">
    <!-- HEADER -->
    <div class="header">
        <img src="logo.jpeg" alt="MEDHAMANTRA Logo" class="logo">
        <div class="brand">
            <span class="medha">MEDHA</span><span class="mantra">MANTRA</span>
        </div>
        <div class="subtitle">Employee Attendance System</div>
    </div>

    <div class="content">
        <!-- LOCATION STATUS -->
        <div class="status">
            <i id="statusIcon" class="fa-solid fa-location-dot" style="color:#facc15"></i>
            <span id="statusText">Checking office location...</span>
        </div>

        <!-- EMPLOYEE -->
        <div class="field">
            <label>EMPLOYEE</label>
            <div class="select-wrap">
                <select id="employee">
                    <option value="">Select Name</option>
                </select>
                <i class="fa-solid fa-user"></i>
            </div>
        </div>

        <!-- ACTION -->
        <div class="field">
            <label>ACTION</label>
            <div class="select-wrap">
                <select id="action">
                    <option value="Entry">Entry</option>
                    <option value="Tiffin Exit">Tiffin Exit</option>
                    <option value="Tiffin Entry">Tiffin Entry</option>
                    <option value="Exit">Exit</option>
                </select>
                <i class="fa-solid fa-arrow-right-arrow-left"></i>
            </div>
        </div>

        <!-- CAMERA -->
        <div class="camera-box">
            <div class="camera-container">
                <video id="video" autoplay playsinline></video>
                <img id="preview" class="hidden" alt="Selfie Preview">
                <div class="camera-ring"></div>
            </div>
        </div>
        <div class="camera-text">
            <i class="fa-solid fa-camera"></i>&nbsp; Take your selfie
        </div>

        <!-- BUTTONS -->
        <div style="margin-top:24px">
            <button class="capture" onclick="capture()">
                <i class="fa-solid fa-camera"></i>&nbsp; CAPTURE SELFIE
            </button>
            <button class="submit" onclick="submitAttendance()">
                <i class="fa-solid fa-check"></i>&nbsp; SUBMIT ATTENDANCE
            </button>
            <button id="installButton" class="install" onclick="installApp()">
                <i class="fa-solid fa-download"></i>&nbsp; INSTALL MEDHAMANTRA APP
            </button>
        </div>
    </div>

    <div class="footer">
        <i class="fa-solid fa-shield-halved"></i>&nbsp; Secure Attendance • Location Verified<br>
        MEDHAMANTRA
    </div>
</div>

<!-- RESULT -->
<div id="result">
    <div class="result-box">
        <div id="resultIcon" class="result-icon"></div>
        <div id="resultTitle" class="result-title"></div>
        <div id="resultDetails" class="result-details"></div>
        <button class="done" onclick="resetUI()">Done</button>
    </div>
</div>

<canvas id="canvas" class="hidden"></canvas>

<script>
/* =====================================================
   MEDHAMANTRA APP CONFIGURATION
   ===================================================== */
const APP_CONFIG = {
    institutionName: "MEDHAMANTRA",
    logo: "logo.jpeg",
    googleScriptUrl: "https://script.google.com/macros/s/AKfycbyD81wilcdqqpBiy8Tu-zQpbvkiRzPNe579bfXJIbfrp2GjI5zZZfDhq_Xvc0wNkLlt/exec",
    officeLat: 23.16885047334248,
    officeLon: 88.09653289564828,
    radiusMeters: 100,
    employees: [
        "Sagar Bala",
        "Dipan",
        "Jhuma Das",
        "Nikunja Ghosh",
        "king",
        "guest-2"
    ]
};

let imageData = "";
let locationApproved = false;
let currentStream = null;
let deferredPrompt = null;

const video = document.getElementById("video");
const preview = document.getElementById("preview");
const statusText = document.getElementById("statusText");
const statusIcon = document.getElementById("statusIcon");
const employeeSelect = document.getElementById("employee");

function loadEmployees() {
    employeeSelect.innerHTML = '<option value="">Select Name</option>';
    APP_CONFIG.employees.forEach(name => {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        employeeSelect.appendChild(option);
    });
}

async function initCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
        });
        currentStream = stream;
        video.srcObject = stream;
    } catch (error) {
        console.error(error);
        alert("Unable to access camera. Please allow camera permission.");
    }
}

function checkLocation() {
    if (!navigator.geolocation) {
        statusText.textContent = "Geolocation not supported";
        return;
    }
    statusText.textContent = "Checking location...";
    navigator.geolocation.getCurrentPosition(
        position => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const distance = getDistance(lat, lon, APP_CONFIG.officeLat, APP_CONFIG.officeLon);
            if (distance <= APP_CONFIG.radiusMeters) {
                locationApproved = true;
                statusText.textContent = "Location Approved ✓";
                statusIcon.className = "fa-solid fa-location-dot";
                statusIcon.style.color = "#4ade80";
            } else {
                locationApproved = false;
                statusText.textContent = "Outside Office Radius";
                statusIcon.className = "fa-solid fa-circle-exclamation";
                statusIcon.style.color = "#ef4444";
            }
        },
        error => {
            console.error(error);
            locationApproved = false;
            statusText.textContent = "Location access denied";
            statusIcon.className = "fa-solid fa-circle-exclamation";
            statusIcon.style.color = "#ef4444";
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
}

function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}

function capture() {
    if (!video.srcObject) {
        alert("Camera is not ready.");
        return;
    }
    const canvas = document.getElementById("canvas");
    canvas.width = video.videoWidth || 720;
    canvas.height = video.videoHeight || 720;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    imageData = canvas.toDataURL("image/jpeg", 0.60);
    preview.src = imageData;
    preview.classList.remove("hidden");
    video.classList.add("hidden");
}

async function submitAttendance() {
    if (!locationApproved) {
        alert("❌ You must be inside the office location.");
        return;
    }
    if (!imageData) {
        alert("Please capture your selfie first.");
        return;
    }
    const employee = employeeSelect.value;
    const action = document.getElementById("action").value;
    if (!employee) {
        alert("Please select your name.");
        return;
    }
    if (!APP_CONFIG.googleScriptUrl || APP_CONFIG.googleScriptUrl === "YOUR_GOOGLE_APPS_SCRIPT_URL") {
        alert("Google Apps Script URL is not configured.");
        return;
    }

    const now = new Date();
    const time = now.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    const date = now.toLocaleDateString("en-CA");

    try {
        const button = document.querySelector(".submit");
        button.disabled = true;
        button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> SUBMITTING...';

        const response = await fetch(APP_CONFIG.googleScriptUrl, {
            method: "POST",
            body: new URLSearchParams({
                employee: employee,
                action: action,
                time: time,
                date: date,
                image: imageData
            })
        });
        const result = await response.text();
        showResult(result.trim(), employee, action, time);
    } catch (error) {
        console.error(error);
        showResult("ERROR", employee, action, time);
    } finally {
        const button = document.querySelector(".submit");
        button.disabled = false;
        button.innerHTML = '<i class="fa-solid fa-check"></i> &nbsp; SUBMIT ATTENDANCE';
    }
}

function showResult(response, employee, action, time) {
    const result = document.getElementById("result");
    const icon = document.getElementById("resultIcon");
    const title = document.getElementById("resultTitle");
    const details = document.getElementById("resultDetails");
    result.style.display = "flex";

    if (response === "NAME_ERROR") {
        icon.textContent = "❌";
        title.textContent = "Name Error";
        title.style.color = "#ef4444";
        details.textContent = "Selected name does not match the attendance records.";
    } else if (response === "ENTRY_REQUIRED") {
        icon.textContent = "⚠️";
        title.textContent = "Action Order";
        title.style.color = "#f59e0b";
        details.textContent = "First action must be Entry.";
    } else if (response === "ALREADY") {
        icon.textContent = "⚠️";
        title.textContent = "Already Recorded";
        title.style.color = "#eab308";
        details.innerHTML = `${employee}<br>Attendance already submitted today.`;
    } else if (response === "ERROR") {
        icon.textContent = "❌";
        title.textContent = "Submission Failed";
        title.style.color = "#ef4444";
        details.textContent = "Unable to connect with Google Sheet. Please try again.";
    } else {
        const hour = new Date().getHours();
        let greeting;
        if (hour >= 5 && hour < 12) greeting = "🌅 Good Morning";
        else if (hour >= 12 && hour < 15) greeting = "☀️ Good Noon";
        else if (hour >= 15 && hour < 18) greeting = "🌇 Good Afternoon";
        else if (hour >= 18 && hour < 22) greeting = "🌆 Good Evening";
        else greeting = "🌙 Good Night";

        icon.textContent = "✅";
        title.textContent = greeting;
        title.style.color = "#4ade80";
        details.innerHTML = `
            Mr. <strong>${employee}</strong><br><br>
            Your <strong>${action}</strong> was submitted successfully.<br><br>
            🕒 ${time}
        `;
    }
}

function resetUI() {
    document.getElementById("result").style.display = "none";
    preview.classList.add("hidden");
    video.classList.remove("hidden");
    imageData = "";
    checkLocation();
}

window.addEventListener("beforeinstallprompt", event => {
    event.preventDefault();
    deferredPrompt = event;
    document.getElementById("installButton").style.display = "block";
});

async function installApp() {
    if (!deferredPrompt) {
        alert("App installation is not available in this browser. Use Chrome and open the website over HTTPS.");
        return;
    }
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById("installButton").style.display = "none";
}

if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(error => console.error("Service Worker Error:", error));
    });
}

window.addEventListener("load", () => {
    loadEmployees();
    initCamera();
    checkLocation();
});

window.addEventListener("beforeunload", () => {
    if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
    }
});
</script>
</body>
</html>
